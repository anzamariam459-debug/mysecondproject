<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            margin: 0;
            color: #333;
        }

        .puzzle-container {
            background-color: #ffffff;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            padding: 30px;
            width: fit-content;
            margin-top: 20px;
            text-align: center;
        }

        h1 {
            color: #4a4a4a;
            margin-bottom: 25px;
            font-size: 2.5em;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
        }

        #puzzle-grid {
            display: grid;
            grid-template-columns: repeat(3, 100px); /* For a 3x3 puzzle */
            grid-template-rows: repeat(3, 100px);
            gap: 5px;
            width: 315px; /* 3*100px + 2*5px */
            height: 315px;
            background-color: #e0e0e0;
            border-radius: 10px;
            padding: 5px;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.1);
        }

        .puzzle-piece {
            width: 100px;
            height: 100px;
            background-color: #66b3ff; /* Blue pieces */
            color: #fff;
            font-size: 2em;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease-in-out;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            user-select: none;
        }

        .puzzle-piece:hover {
            transform: scale(1.03);
            box-shadow: 0 6px 12px rgba(0,0,0,0.15);
        }

        .empty-piece {
            background-color: #f0f2f5; /* Light grey for empty spot */
            cursor: default;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.05);
        }

        #controls {
            margin-top: 25px;
        }

        #reset-btn {
            background-color: #28a745; /* Green reset button */
            color: #fff;
            border: none;
            border-radius: 25px;
            padding: 12px 25px;
            font-size: 1.1em;
            cursor: pointer;
            transition: background-color 0.3s ease;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        #reset-btn:hover {
            background-color: #218838;
            transform: translateY(-2px);
        }

        #moves-count, #status-message {
            margin-top: 15px;
            font-size: 1.1em;
            color: #555;
        }
        #status-message.win {
            color: #28a745;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="puzzle-container">
        <h1>Sliding Puzzle</h1>
        <div id="puzzle-grid"></div>
        <div id="controls">
            <p id="moves-count">Moves: 0</p>
            <button id="reset-btn">Reset Puzzle</button>
        </div>
        <p id="status-message"></p>
    </div>
    <script>
        const puzzleGrid = document.getElementById('puzzle-grid');
        const movesCountElement = document.getElementById('moves-count');
        const resetButton = document.getElementById('reset-btn');
        const statusMessageElement = document.getElementById('status-message');

        let puzzleData = [];
        let emptyIndex = 8; // For a 3x3 grid, 0-8. Empty piece is initially the last one.
        let moves = 0;
        const gridSize = 3;
        const totalPieces = gridSize * gridSize;

        function init() {
            puzzleData = Array.from({ length: totalPieces - 1 }, (_, i) => i + 1);
            puzzleData.push(0); // 0 represents the empty space
            emptyIndex = totalPieces - 1;
            shuffle(puzzleData);
            moves = 0;
            movesCountElement.textContent = `Moves: ${moves}`;
            statusMessageElement.textContent = '';
            render();
        }

        function render() {
            puzzleGrid.innerHTML = '';
            puzzleData.forEach((number, index) => {
                const piece = document.createElement('div');
                piece.classList.add('puzzle-piece');
                if (number === 0) {
                    piece.classList.add('empty-piece');
                    piece.innerHTML = '';
                } else {
                    piece.textContent = number;
                }
                piece.dataset.index = index;
                piece.addEventListener('click', handlePieceClick);
                puzzleGrid.appendChild(piece);
            });
        }

        function shuffle(array) {
            // Basic Fisher-Yates shuffle
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            // Ensure the puzzle is solvable (for N*N grid, N odd, always solvable if even inversions)
            // For N*N grid, N even, solvability depends on row of empty tile and inversions
            // For simplicity, we'll just shuffle and if it's unsolvable, the user can reset.
            // A proper solvability check and re-shuffle would be more complex.

            // Find the new emptyIndex after shuffle
            emptyIndex = array.indexOf(0);
        }

        function handlePieceClick(event) {
            const clickedIndex = parseInt(event.target.dataset.index);
            if (isValidMove(clickedIndex)) {
                swapPieces(clickedIndex, emptyIndex);
                moves++;
                movesCountElement.textContent = `Moves: ${moves}`;
                render();
                if (checkWin()) {
                    statusMessageElement.textContent = 'Congratulations! You solved the puzzle!';
                    statusMessageElement.classList.add('win');
                    puzzleGrid.querySelectorAll('.puzzle-piece').forEach(piece => piece.removeEventListener('click', handlePieceClick));
                }
            }
        }

        function isValidMove(clickedIndex) {
            const clickedRow = Math.floor(clickedIndex / gridSize);
            const clickedCol = clickedIndex % gridSize;
            const emptyRow = Math.floor(emptyIndex / gridSize);
            const emptyCol = emptyIndex % gridSize;

            const rowDiff = Math.abs(clickedRow - emptyRow);
            const colDiff = Math.abs(clickedCol - emptyCol);

            return (rowDiff === 1 && colDiff === 0) || (rowDiff === 0 && colDiff === 1);
        }

        function swapPieces(index1, index2) {
            [puzzleData[index1], puzzleData[index2]] = [puzzleData[index2], puzzleData[index1]];
            emptyIndex = index1;
        }

        function checkWin() {
            for (let i = 0; i < totalPieces - 1; i++) {
                if (puzzleData[i] !== i + 1) {
                    return false;
                }
            }
            return true;
        }

        resetButton.addEventListener('click', init);

        init(); // Initialize the game when the page loads
    </script>
</body>
</html>
